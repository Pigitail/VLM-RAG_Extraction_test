[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlmrag"
version = "0.1.0"
description = "Reference implementation of VLM-assisted document extraction for RAG: engineering drawings, slide manuals and Word specifications."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.66",
    "pypdfium2>=4.30",
    "pillow>=10.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "lxml>=5.0",
]

[project.optional-dependencies]
synthetic = ["reportlab>=4.0"]
dev = ["pytest>=8", "reportlab>=4.0", "pyflakes>=3"]

[project.scripts]
vlmrag = "vlmrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vlmrag = ["**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "soffice: needs LibreOffice (skipped when it is not installed)",
    "network: calls a real VLM endpoint (skipped unless VLMRAG_RUN_NETWORK_TESTS=1)",
]
